name: Release

# Pushing a tag, v7.0.0 say, releases it: Packagist picks the tag up through
# its GitHub hook, and this creates the GitHub release with notes generated
# from the commits since the previous tag. composer.json has no version: the
# tag is the version.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - uses: ramsey/composer-install@v3
      - name: The generated code and API.md are current
        run: |
          composer generate-check
          composer docs-check
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" $prerelease
